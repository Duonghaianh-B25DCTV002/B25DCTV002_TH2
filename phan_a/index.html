<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Thư viện sách trực tuyến — xem, tìm kiếm, lọc thể loại, yêu thích và thêm sách mới." />
  <title>📚 Thư Viện Sách</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header class="header" id="header">
    <div class="header__inner">
      <div class="header__brand">
        <h1 class="header__title">Thư Viện Sách</h1>
      </div>
      <div class="header__actions">
        <label class="theme-switch" aria-label="Chuyển chế độ sáng/tối">
          <input type="checkbox" id="theme-toggle" />
          <span class="slider"></span>
        </label>
        <div class="header__badge" id="favorite-badge">
          Yêu thích: <span class="badge__count" id="favorite-count">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="main">
    <!-- Thanh công cụ -->
    <section class="toolbar" id="toolbar">
      <div class="toolbar__search">
        <input
          type="text"
          class="search__input"
          id="search-input"
          placeholder="Tìm kiếm theo tên sách..."
          autocomplete="off"
        />
      </div>
      <div class="toolbar__filters" id="genre-filters">
        <!-- Nút lọc thể loại sẽ được render bằng JS -->
      </div>
    </section>

    <!-- Dòng trạng thái -->
    <div class="status" id="status">
      <p class="status__text" id="status-text">Đang tải...</p>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="loading__spinner"></div>
      <p class="loading__text">Đang tải dữ liệu...</p>
    </div>

    <!-- Thông báo lỗi -->
    <div class="error" id="error" hidden>
      <p class="error__text" id="error-text"></p>
      <button class="btn btn--primary" id="retry-btn">Thử lại</button>
    </div>

    <!-- Lưới sách -->
    <section class="book-grid" id="book-grid">
      <!-- Cards sẽ được render bằng JS -->
    </section>

    <!-- Form thêm sách -->
    <section class="form-section" id="form-section">
      <h2 class="form-section__title">Thêm Sách Mới</h2>
      <form class="book-form" id="book-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="book-title">Tên sách</label>
          <input
            type="text"
            class="form-input"
            id="book-title"
            name="title"
            placeholder="Nhập tên sách (tối thiểu 3 ký tự)..."
          />
          <span class="form-error" id="error-title"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="book-author">Tác giả</label>
          <input
            type="text"
            class="form-input"
            id="book-author"
            name="author"
            placeholder="Nhập tên tác giả..."
          />
          <span class="form-error" id="error-author"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="book-genre">Thể loại</label>
          <select class="form-input form-select" id="book-genre" name="genre">
            <option value="">-- Chọn thể loại --</option>
            <option value="Văn học">Văn học</option>
            <option value="Khoa học">Khoa học</option>
            <option value="Lịch sử">Lịch sử</option>
            <option value="Công nghệ">Công nghệ</option>
            <option value="other">Khác</option>
          </select>
          <span class="form-error" id="error-genre"></span>

          <input
            type="text"
            class="form-input"
            id="book-genre-other"
            name="genreOther"
            placeholder="Nhập thể loại..."
            style="display: none; margin-top: 8px;"
          />
          <span class="form-error" id="error-genreOther"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="book-year">Năm xuất bản</label>
          <input
            type="number"
            class="form-input"
            id="book-year"
            name="year"
            placeholder="1900 – 2026"
            min="1900"
            max="2026"
          />
          <span class="form-error" id="error-year"></span>
        </div>

        <button type="submit" class="btn btn--primary btn--full" id="submit-btn">
          Thêm sách
        </button>
      </form>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <p>© 2026 Thư Viện Sách — Bài Thực Hành LTW</p>
  </footer>

  <!-- JS Modules -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
